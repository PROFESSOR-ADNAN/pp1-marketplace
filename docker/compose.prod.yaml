services:
  nginx:
    image: nginx:1.26-alpine
    container_name: souq-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
      - ../nginx/error-pages:/usr/share/nginx/html/error-pages:ro
      - web-static:/usr/share/nginx/html:ro
      - certs-data:/etc/letsencrypt:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    networks:
      - souq-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  api-1:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: souq-api-1
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/souq_prod?replicaSet=rs0
      - REDIS_URI=redis://redis:6379
    env_file:
      - ../.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - souq-net
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M

  api-2:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: souq-api-2
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/souq_prod?replicaSet=rs0
      - REDIS_URI=redis://redis:6379
    env_file:
      - ../.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - souq-net
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    container_name: souq-worker
    restart: always
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/souq_prod?replicaSet=rs0
      - REDIS_URI=redis://redis:6379
    env_file:
      - ../.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - souq-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  mongo:
    image: mongo:7.0
    container_name: souq-mongo
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - souq-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  redis:
    image: redis:7.4-alpine
    container_name: souq-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - souq-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

networks:
  souq-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  web-static:
  certs-data:
