services:
  mongo:
    image: mongo:7.0
    container_name: souq-mongo-dev
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - souq-dev-net

  redis:
    image: redis:7.4-alpine
    container_name: souq-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - souq-dev-net

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: souq-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: souq_dev_access
      MINIO_ROOT_PASSWORD: souq_dev_secret_key_12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-dev-data:/data
    networks:
      - souq-dev-net

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: souq-mailpit-dev
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - souq-dev-net

networks:
  souq-dev-net:
    driver: bridge

volumes:
  mongo-dev-data:
  redis-dev-data:
  minio-dev-data:
