services:
  - type: web
    name: souq-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:api && npm run build:worker
    startCommand: npm run start:render
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_BASE_URL
        value: https://souq-api-xxdp.onrender.com
      - key: CLIENT_URL
        value: https://souq-web.vercel.app
      - key: MONGO_URI
        sync: false
      - key: REDIS_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: COOKIE_SECRET
        sync: false
      - key: CHAPA_PUBLIC_KEY
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@souq.test
      - key: ADMIN_PASSWORD
        value: admin1234
