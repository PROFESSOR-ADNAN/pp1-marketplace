groups:
  - name: souq_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(souq_http_request_duration_seconds_count{status_code=~"5.."}[5m]) / rate(souq_http_request_duration_seconds_count[5m]) > 0.005
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx error rate exceeds 0.5% SLO budget"
          runbook_url: "https://github.com/PROFESSOR-ADNAN/pp1-marketplace/blob/main/docs/runbooks/high-latency.md"

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(souq_http_request_duration_seconds_bucket[5m])) by (le)) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency exceeds 300ms target"
          runbook_url: "https://github.com/PROFESSOR-ADNAN/pp1-marketplace/blob/main/docs/runbooks/high-latency.md"

      - alert: DatabaseDown
        expr: up{job="souq-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API instance down or database unreachable"
          runbook_url: "https://github.com/PROFESSOR-ADNAN/pp1-marketplace/blob/main/docs/runbooks/database-down.md"
