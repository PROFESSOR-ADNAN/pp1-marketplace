upstream api_upstream {
  least_conn;
  server api-1:5000 max_fails=3 fail_timeout=10s;
  server api-2:5000 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name localhost example.com *.example.com;

  include /etc/nginx/snippets/security-headers.conf;

  # Block dangerous scans & malicious probes
  location ~* (\/\.env|\/\.git|wp-login|\.php|phpmyadmin) {
    return 404;
  }

  # Health check
  location /healthz {
    proxy_pass http://api_upstream/healthz;
    access_log off;
  }

  # API Endpoints
  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Auth rate limit
  location /api/v1/auth/ {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static Web SPA
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;

    # Static assets cache control (hashed files)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|webp)$ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }

  error_page 404 /error-pages/404.html;
  error_page 500 502 504 /error-pages/500.html;
  error_page 503 /error-pages/503.html;

  location ^~ /error-pages/ {
    internal;
    root /usr/share/nginx/html;
  }
}
